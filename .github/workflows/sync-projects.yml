name: Sync GitHub projects

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/project-config.json
      - scripts/sync-projects.mjs
      - .github/workflows/sync-projects.yml

permissions:
  contents: write

concurrency:
  group: sync-github-projects
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch public repositories
        run: node scripts/sync-projects.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated project data
        run: |
          if [ -z "$(git status --porcelain -- data/projects.json assets/projects)" ]; then
            echo "Project data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json assets/projects
          git commit -m "chore: sync GitHub projects"
          git push
