name: Sync GitHub projects

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - data/project-config.json
      - scripts/sync-projects.mjs
      - .github/workflows/sync-projects.yml

permissions:
  contents: write

concurrency:
  group: sync-github-projects
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          # 동기화 스크립트는 Node 내장 모듈만 쓴다.
          package-manager-cache: false

      - name: Fetch public repositories
        run: node scripts/sync-projects.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit updated project data
        run: |
          if [ -z "$(git status --porcelain -- data/projects.json assets/projects)" ]; then
            echo "Project data is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json assets/projects
          git commit -m "chore: sync GitHub projects"

          # 동기화 도중 main에 다른 push가 들어오면 그 위로 다시 얹고 재시도한다.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push attempt ${attempt} failed, retrying."
            sleep $((attempt * 5))
          done
          exit 1
